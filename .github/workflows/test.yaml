name: Stolsis CI

on:
  pull_request:
  push:
    branches: [main]

env:
  WORKING_DIRECTORY: ./contracts

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check format
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Format
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb fmt --check
        shell: bash

  build:
    runs-on: ubuntu-latest
    name: Build game
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb build
        shell: bash

  test:
    runs-on: ubuntu-latest
    name: Test game
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          foundry: "true"
      - name: Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: snforge test
        shell: bash

  ci:
    runs-on: ubuntu-latest
    name: ci
    if: always()
    needs: [check, build, test]
    steps:
      - name: Require every job to have succeeded or been skipped
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
        shell: bash
