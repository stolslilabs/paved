name: Stolsis CI

on:
  pull_request:
  push:
    branches: [main]

env:
  WORKING_DIRECTORY: ./contracts

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # dorny/paths-filter v3.0.4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          # On push to main, compare with the previous commit; on a PR, with its base.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/abis.sh'
              - '.tool-versions'
              - '.github/workflows/**'
              - '.github/actions/**'

  check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Check format
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Format
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb fmt --check
        shell: bash

  build:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Build game
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb build
        shell: bash

  abis:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Contract ABIs up to date
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Regenerate ABIs
        run: scripts/abis.sh
        shell: bash
      - name: Fail if the committed ABIs are stale
        run: |
          # Also catches a committed file that was deleted: the script rewrites it untracked.
          git add --intent-to-add contracts/abis
          git diff --exit-code contracts/abis
        shell: bash

  test:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Test game
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          foundry: "true"
      - name: Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: snforge test
        shell: bash

  ci:
    runs-on: ubuntu-latest
    name: ci
    if: always()
    needs: [changes, check, build, abis, test]
    steps:
      - name: Require every job to have succeeded or been skipped
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
        shell: bash
