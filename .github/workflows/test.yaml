name: Stolsis CI

on:
  pull_request:
  push:
    branches: [main]

env:
  WORKING_DIRECTORY: ./contracts

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      indexer: ${{ steps.filter.outputs.indexer }}
      client: ${{ steps.filter.outputs.client }}
      signer: ${{ steps.filter.outputs.signer }}
      e2e: ${{ steps.filter.outputs.e2e }}
      vercel: ${{ steps.filter.outputs.vercel }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # dorny/paths-filter v3.0.4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          # On push to main, compare with the previous commit; on a PR, with its base.
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/abis.sh'
              - 'scripts/class-sizes.sh'
              - 'scripts/check-artifact-names.sh'
              - 'scripts/deploy.sh'
              - 'scripts/measure.sh'
              - 'scripts/node/run-sample.sh'
              - 'scripts/test-deploy-url.sh'
              - 'scripts/signer/**'
              - '.tool-versions'
              - '.github/workflows/**'
              - '.github/actions/**'
            indexer:
              - 'packages/indexer/**'
              # What the indexer reads from the contracts: the ABIs its decoders are tested against and the
              # deployment file its tests parse. A change of packages/indexer alone runs no contracts job.
              - 'contracts/abis/**'
              - 'contracts/deployments/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '.github/workflows/test.yaml'
            client:
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/workflows/test.yaml'
              # What the client consumes from the contracts: the ABIs and the deploy output (addresses,
              # class hashes). Not `contracts/**`: most Cairo sources do not change the client. P2
              # (#197) removed the manifests the client imported and no client job ran. The rule sources
              # that game-core's scripts transcribe (generate-tables.ts reads structure/tables.cairo;
              # transcribe-goldens.ts reads the goldens and differential.cairo) run its table and parity
              # tests, and so does the parity fixture CORE records (P-49).
              - 'contracts/abis/**'
              - 'contracts/deployments/**'
              - 'contracts/src/structure/tables.cairo'
              - 'contracts/src/tests/golden/**'
              - 'contracts/src/tests/differential.cairo'
              - 'contracts/fixtures/**'
            # The Training Playwright e2e (packages/app-web/e2e): it mounts the real board in a browser, so the board's
            # renderer, the rules and the app run it. Not the whole `packages/**` of the client job. The dev server it
            # starts aliases @paved/chain and @paved/ui to their sources (app-web/vite.config.ts, e2e/vitest.config.ts), so
            # those two are in; bun.lock and the root package.json change the installed versions the browser runs.
            e2e:
              - 'packages/renderer/**'
              - 'packages/game-core/**'
              - 'packages/app/**'
              - 'packages/app-web/**'
              - 'packages/chain/**'
              - 'packages/ui/**'
              - 'bun.lock'
              - 'package.json'
              - '.github/workflows/test.yaml'
            # The inputs of the two Vercel projects (GUARDS, P-71): the includes of scripts/vercel/ignore-build.sh
            # --paths storybook (the client's inputs and the root vercel.json; its Markdown excludes are not repeated
            # here), plus the guards' scripts. Keep the two lists together.
            vercel:
              - 'packages/app/**'
              - 'packages/chain/**'
              - 'packages/game-core/**'
              - 'packages/renderer/**'
              - 'packages/ui/**'
              - 'contracts/abis/**'
              - 'contracts/deployments/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vercel.json'
              - 'scripts/vercel/**'
              - 'scripts/check/**'
              - '.githooks/**'
              - '.github/workflows/test.yaml'
            # The starknet.js signer that signs with the deployer key on Sepolia (P-40): its unit tests gate a merge.
            signer:
              - 'scripts/signer/**'
              - '.github/workflows/test.yaml'

  check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Check format
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Format
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb fmt --check
        shell: bash

  build:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Build game
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # Static (reads contracts/src, deploy.sh and scripts/signer/**; no build, no node): first, so a wrong name fails
      # in seconds and not after the build. This job runs on contracts/**, deploy.sh and signer/** (the `contracts` filter).
      - name: Artifact names the scripts load exist in the build
        run: scripts/check-artifact-names.sh
        shell: bash
      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb build
        shell: bash
      - name: Class sizes (Starknet limits)
        run: scripts/class-sizes.sh
        shell: bash
      # Node 24 and the signer's packages, so test-deploy-url.sh runs its cases through the real signer (sepolia
      # --estimate-only, the funding check, a lost declare) instead of skipping them (S-1d). No key, no node: the signer
      # talks to the fake node the test preloads.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install the signer
        working-directory: scripts/signer
        run: npm ci --ignore-scripts --no-audit --no-fund
        shell: bash
      - name: Deploy script checks (getClass answer, no Mode in the ABIs)
        run: scripts/test-deploy-url.sh
        shell: bash

  abis:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Contract ABIs up to date
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Regenerate ABIs
        run: scripts/abis.sh
        shell: bash
      - name: Fail if the committed ABIs are stale
        run: |
          # Also catches a committed file that was deleted: the script rewrites it untracked.
          git add --intent-to-add contracts/abis
          git diff --exit-code contracts/abis
        shell: bash

  test:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Test game
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          foundry: "true"
      - name: Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: snforge test
        shell: bash

  indexer:
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    name: Test indexer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The same setup as the client job: the engines' Node (the daemon runs its TypeScript natively) and the pinned Bun.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # Typecheck (the package's build), then the unit tests. The devnet scenario (`test:devnet`) needs a node: not here.
      - name: Test
        run: bun run test --filter @paved/indexer

  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    name: Build and test client
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # tsc, vite and vitest run on Node (their bin shebang): pin the engines' Node.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      # ImageOS is set by the runner in the process environment, which the `env` context does
      # not expose, so a step reads it and passes it on.
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: modules
        with:
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
            !packages/*/node_modules/.cache
            !packages/*/node_modules/.vite
          # Exact key only: a hit skips the install, a miss installs and saves. The key
          # covers every manifest, so a package.json change without bun.lock cannot hit. The
          # image OS (ubuntu24, ...) is in the key so a runner image migration cannot restore
          # native binaries built on the old one. ImageVersion is left out on purpose: it
          # changes about weekly and would reset the cache each time for no real gain.
          key: node-modules-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-node-24-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json') }}
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # A broken story fails the pull request (docs/client/v2-architecture.md, section 4.4).
      - name: Build Storybook
        run: bun run --filter @paved/app build-storybook
      # WRAP360: every story at 360 and 320 px, headless; fails on text that overflows, is cut without its full value, or
      # scrolls the page (packages/app/scripts/wrap-sweep.ts). The browser is the one the app's playwright-core 1.63.0
      # names (chromium-headless-shell revision 1243), cached under that version like the e2e job's.
      - name: Playwright version
        id: playwright
        working-directory: packages/app
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
        shell: bash
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install the browser
        working-directory: packages/app
        run: bunx playwright-core install --with-deps chromium-headless-shell
        shell: bash
      - name: Wrap sweep (360 and 320 px)
        run: bun run --filter @paved/app wrap-sweep
      # APP-FEEL (P-69): a mobile device context, headless: no page zoom, the board still pinch-zooms.
      - name: Mobile feel (Pixel 7 profile)
        run: bun run --filter @paved/app mobile-feel
      - name: Test
        run: bun run test
      # The burner key never ships outside devnet (BUILD_BURNER, packages/app/src/wallet/connector.ts): a Sepolia build with
      # a sentinel in VITE_PLAYER_PRIVATE_KEY, then no file of dist/, source maps included, may hold it. Last, as it rebuilds
      # dist/. A devnet build with the same sentinel holds it (in the connector's chunk): the check can fail.
      - name: Burner key check (Sepolia build)
        env:
          VITE_NETWORK: sepolia
          VITE_PLAYER_ADDRESS: "0x1"
          VITE_PLAYER_PRIVATE_KEY: paved-burner-sentinel-7c41e9
        run: |
          bun run --filter @paved/app build
          if [ -z "$(find packages/app/dist -name '*.map' -print -quit)" ]; then echo "No source map in dist/: the check would miss them"; exit 1; fi
          if grep -rlF "$VITE_PLAYER_PRIVATE_KEY" packages/app/dist; then echo "The burner key is in the Sepolia build"; exit 1; fi
        shell: bash

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    name: Training e2e (headless)
    # Measured 4 min 01 s with warm caches (the vitest step 205 s). About twice: 8 min.
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      # The heap cap of app-web's tests (AGENTS.md): the T2 run used the same.
      NODE_OPTIONS: --max-old-space-size=1536
      # One full game, not the local default of 2: clearly shorter, same code paths.
      PAVED_E2E_GAMES: "1"
      PAVED_E2E_SHOTS: ${{ github.workspace }}/e2e-shots
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      # The same modules cache and key as the client job: the same files, so one job's save serves the other.
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: modules
        with:
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
            !packages/*/node_modules/.cache
            !packages/*/node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-node-24-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json') }}
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      # The browser is the one playwright-core 1.63.0 (pinned in packages/app-web/package.json and bun.lock) names:
      # chromium-headless-shell revision 1243, Chrome 153.0.8010.12 (browsers.json of that version). The command runs
      # from the workspace, so it resolves the locked package and never a newer one. Its folder is cached under the
      # pinned version; a miss downloads the same revision.
      - name: Playwright version
        id: playwright
        working-directory: packages/app-web
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
        shell: bash
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      # --with-deps also installs the system libraries (apt) on a hit: the cache holds the browser folder only.
      - name: Install the browser
        working-directory: packages/app-web
        run: bunx playwright-core install --with-deps chromium-headless-shell
        shell: bash
      - name: Training e2e
        working-directory: packages/app-web
        run: |
          mkdir -p "$PAVED_E2E_SHOTS"
          bun run e2e
        shell: bash
      # actions/upload-artifact v4.6.2
      - name: Upload the screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-shots
          path: e2e-shots
          retention-days: 7
          if-no-files-found: ignore

  signer:
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    name: Test signer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # In scripts/signer/ only, from its lockfile. The devnet rehearsal tests skip themselves: no node binary and no
      # build here (they run on the VPS, docs/programme/OPERATIONS.md).
      - name: Test
        working-directory: scripts/signer
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        shell: bash

  # GUARDS (P-71): the exact Vercel build of each project (its vercel.json's install and build commands, from its root
  # directory, with the Sepolia env of packages/app/vercel.json), so a Vercel break shows on the pull request before the
  # merge, not on main. `bun run check` runs the same script locally. Keep the job's name: it may become a required check.
  vercel:
    needs: changes
    if: needs.changes.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    name: Vercel build (Sepolia)
    permissions:
      contents: read
    steps:
      # The whole history: the ignore step's test judges real commits of main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The same setup and cache as the client job.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
            !packages/*/node_modules/.cache
            !packages/*/node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-node-24-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json') }}
      # The guards' own tests: the touched set of `bun run check` and the Vercel ignore step on real commits.
      - name: Guard scripts
        run: |
          node --test scripts/check/touched.test.mts
          sh scripts/vercel/ignore-build.test.sh
        shell: bash
      # Each command runs its vercel.json's installCommand first (bun install --frozen-lockfile), as Vercel does.
      - name: Client (packages/app/vercel.json)
        run: node scripts/check/vercel-build.mts client
      - name: Bundle budget, with its margins
        run: bun run budget
      - name: Storybook (vercel.json)
        run: node scripts/check/vercel-build.mts storybook --no-install

  ci:
    runs-on: ubuntu-latest
    name: ci
    if: always()
    needs: [changes, check, build, abis, test, indexer, client, e2e, signer, vercel]
    steps:
      - name: Require every job to have succeeded or been skipped
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
        shell: bash
