name: Stolsis CI

on:
  pull_request:
  push:
    branches: [main]
  # GitHub's merge queue: each group is tested on top of main and of the groups ahead of it.
  merge_group:
    types: [checks_requested]

# A newer push to a PR cancels the run of its previous head. A push to main gets a group of its own
# (its run id), so it is never cancelled nor queued behind another. A merge_group run also gets its own
# group (its run id) and is never cancelled here: the queue cancels and re-creates its own runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WORKING_DIRECTORY: ./contracts

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    permissions:
      contents: read
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      indexer: ${{ steps.filter.outputs.indexer }}
      client: ${{ steps.filter.outputs.client }}
      e2e: ${{ steps.filter.outputs.e2e }}
      signer: ${{ steps.filter.outputs.signer }}
      vercel: ${{ steps.filter.outputs.vercel }}
      e2e_pr: ${{ steps.filter.outputs.e2e_pr }}
      # The wrap sweep's selection (CI-TIERS, #1129): all, some or none; the story files of `some`; the shards.
      stories: ${{ steps.stories.outputs.stories }}
      story_files: ${{ steps.stories.outputs.story_files }}
      shards: ${{ steps.stories.outputs.shards }}
      shard_count: ${{ steps.stories.outputs.shard_count }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # dorny/paths-filter v3.0.4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad
        id: filter
        with:
          # On push to main, compare with the previous commit; on a PR, with its base; on a merge queue group,
          # its own range (base_sha..head_sha: what the group adds to main). Two SHAs take the action's plain
          # `git diff base..head` path, fetching what the shallow checkout lacks.
          base: ${{ github.event_name == 'push' && github.event.before || github.event_name == 'merge_group' && github.event.merge_group.base_sha || '' }}
          ref: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || '' }}
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/abis.sh'
              - 'scripts/class-sizes.sh'
              - 'scripts/check-artifact-names.sh'
              - 'scripts/deploy.sh'
              - 'scripts/measure.sh'
              - 'scripts/node/run-sample.sh'
              - 'scripts/test-deploy-url.sh'
              - 'scripts/signer/**'
              - '.tool-versions'
              - '.github/workflows/**'
              - '.github/actions/**'
            indexer:
              - 'packages/indexer/**'
              # What the indexer reads from the contracts: the ABIs its decoders are tested against and the
              # deployment file its tests parse. A change of packages/indexer alone runs no contracts job.
              - 'contracts/abis/**'
              - 'contracts/deployments/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '.github/workflows/test.yaml'
            client:
              - 'packages/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig*.json'
              - '.github/workflows/test.yaml'
              - '.github/actions/client-setup/**'
              # What the client consumes from the contracts: the ABIs and the deploy output (addresses,
              # class hashes). Not `contracts/**`: most Cairo sources do not change the client. P2
              # (#197) removed the manifests the client imported and no client job ran. The rule sources
              # that game-core's scripts transcribe (generate-tables.ts reads structure/tables.cairo;
              # transcribe-goldens.ts reads the goldens and differential.cairo) run its table and parity
              # tests, and so does the parity fixture CORE records (P-49).
              - 'contracts/abis/**'
              - 'contracts/deployments/**'
              - 'contracts/src/structure/tables.cairo'
              - 'contracts/src/tests/golden/**'
              - 'contracts/src/tests/differential.cairo'
              - 'contracts/fixtures/**'
            # The Training battle test (packages/app/e2e, P-79): the app it plays and the rules it checks every move
            # against; bun.lock and the root package.json change the versions the browser runs.
            e2e:
              - 'packages/app/**'
              - 'packages/game-core/**'
              - 'package.json'
              - 'bun.lock'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '.github/workflows/test.yaml'
            # On a pull request the e2e runs only when the test itself or the rules it checks change (CI-TIERS, open point
            # 2 of #1120, until the owner answers); the merge queue and main keep the whole `e2e` filter above.
            e2e_pr:
              - 'packages/app/e2e/**'
              - 'packages/game-core/**'
            # The inputs of the two Vercel projects (GUARDS, P-71): the includes of scripts/vercel/ignore-build.sh
            # --paths storybook (the client's inputs and the root vercel.json; its Markdown excludes are not repeated
            # here), plus the guards' scripts. Keep the two lists together.
            vercel:
              - 'packages/app/**'
              - 'packages/chain/**'
              - 'packages/game-core/**'
              - 'packages/renderer/**'
              - 'packages/ui/**'
              - 'contracts/abis/**'
              - 'contracts/deployments/**'
              - 'bun.lock'
              - 'package.json'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'vercel.json'
              - 'scripts/vercel/**'
              - 'scripts/check/**'
              - '.githooks/**'
              - '.github/workflows/test.yaml'
            # The starknet.js signer that signs with the deployer key on Sepolia (P-40): its unit tests gate a merge.
            signer:
              - 'scripts/signer/**'
              - '.github/workflows/test.yaml'
      # CI-TIERS (#1129): a pull request sweeps only the stories its change reaches (scripts/check/stories.mts, a static
      # walk of the app's import graph), in up to MAX_SHARDS (5) shards of about 20 story files; every story when it reaches
      # what every story reads. The merge queue and main sweep every story in MAX_SHARDS shards, balanced by each story's CI
      # time (SWEEP-SPEED, #1130; `stories.test.mts` holds the two equal): no story leaves the gate of main. With the client
      # run's 9 other jobs, 14 jobs: the budget. Measured (two full CI sweeps): about 13 min of sweep a shard.
      # The pull request's files come from the API (at most 3000; a longer list sweeps every story).
      # actions/setup-node v7.0.0
      - if: github.event_name == 'pull_request'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Stories the change reaches
        id: stories
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            printf 'stories=all\nstory_files=[]\nshards=[1,2,3,4,5]\nshard_count=5\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          node scripts/check/stories.mts select "$RUNNER_TEMP/changed.txt" >> "$GITHUB_OUTPUT"
        shell: bash

  check:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Check format
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Format
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb fmt --check
        shell: bash

  build:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Build game
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # Static (reads contracts/src, deploy.sh and scripts/signer/**; no build, no node): first, so a wrong name fails
      # in seconds and not after the build. This job runs on contracts/**, deploy.sh and signer/** (the `contracts` filter).
      - name: Artifact names the scripts load exist in the build
        run: scripts/check-artifact-names.sh
        shell: bash
      - name: Build
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: scarb build
        shell: bash
      - name: Class sizes (Starknet limits)
        run: scripts/class-sizes.sh
        shell: bash
      # Node 24 and the signer's packages, so test-deploy-url.sh runs its cases through the real signer (sepolia
      # --estimate-only, the funding check, a lost declare) instead of skipping them (S-1d). No key, no node: the signer
      # talks to the fake node the test preloads.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install the signer
        working-directory: scripts/signer
        run: npm ci --ignore-scripts --no-audit --no-fund
        shell: bash
      - name: Deploy script checks (getClass answer, no Mode in the ABIs)
        run: scripts/test-deploy-url.sh
        shell: bash

  abis:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Contract ABIs up to date
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - name: Regenerate ABIs
        run: scripts/abis.sh
        shell: bash
      - name: Fail if the committed ABIs are stale
        run: |
          # Also catches a committed file that was deleted: the script rewrites it untracked.
          git add --intent-to-add contracts/abis
          git diff --exit-code contracts/abis
        shell: bash

  test:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    name: Test game
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
        with:
          foundry: "true"
      - name: Test
        working-directory: ${{ env.WORKING_DIRECTORY }}
        run: snforge test
        shell: bash

  indexer:
    needs: changes
    if: needs.changes.outputs.indexer == 'true'
    runs-on: ubuntu-latest
    name: Test indexer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The same setup as the client job: the engines' Node (the daemon runs its TypeScript natively) and the pinned Bun.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      # Typecheck (the package's build), then the unit tests. The devnet scenario (`test:devnet`) needs a node: not here.
      - name: Test
        run: bun run test --filter @paved/indexer

  # The client is checked by four kinds of job that run side by side (CI-SPLIT), each from the cached node_modules
  # (.github/actions/client-setup): the build and the unit tests of every package but the app, the app's unit tests in
  # three shards, the Storybook's header, feel and locale checks, and the wrap sweep in shards. Each Storybook job builds
  # the workspace packages and the Storybook itself (about half a minute under the cached install) rather than sharing an
  # artifact. The `ci` job requires all of them.
  #
  # Turbo's cache (APP-TEST-SHARD, #1131): the build and test jobs keep `.turbo/cache` between runs, so a package whose
  # inputs did not change replays its build and tests (turbo.json lists each task's inputs: its package's files, the
  # root files the packages read, contracts/ABIs and deployments included, and the sibling packages' files a test reads;
  # scripts/check/turbo-inputs.test.mts fails on a read outside them). Keyed on the run's SHA; restored from the
  # branch's last run, else main's. Before the save, the cache is pruned to the tasks of this run
  # (scripts/ci/turbo-cache-prune.mts), so it never grows past one run's builds. The app's tests do not go through turbo:
  # they run on every client run.
  #
  # Heap: no NODE_OPTIONS here. The runners have 16 GB and run one vitest at a time per job; the app's 1536 MB cap of
  # AGENTS.md is for the shared VPS.
  client:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    name: Build and test client
    permissions:
      contents: read
    env:
      TURBO_CACHE_DIR: .turbo/cache
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/client-setup
      # actions/cache/restore v4.2.4
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-client-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-client-${{ github.head_ref || github.ref_name }}-
            turbo-${{ runner.os }}-client-main-
      # A file a cached task reads outside its package (a sibling's assets, the ABIs) must be in its turbo.json inputs,
      # or the cache replays a stale success: scripts/check/turbo-inputs.test.mts scans the packages for such reads.
      - name: Turbo inputs cover what the tasks read
        run: node --test scripts/check/turbo-inputs.test.mts
      - name: Build
        run: bun run build
      # Every package's tests but the app's, which the client-app shards run.
      - name: Test
        run: bun run test --filter='!@paved/app'
      # The devnet deployer's key never ships outside devnet (BUILD_DEPLOYER, packages/app/src/wallet/connector.ts, #918): a
      # Sepolia build with a sentinel in VITE_DEPLOYER_PRIVATE_KEY, then no file of dist/, source maps included, may hold it.
      # Last, as it rebuilds dist/. A devnet build with the same sentinel holds it (in the connector's chunk): the check can fail.
      # Not through turbo: it always builds.
      - name: Deployer key check (Sepolia build)
        env:
          VITE_NETWORK: sepolia
          VITE_DEPLOYER_ADDRESS: "0x1"
          VITE_DEPLOYER_PRIVATE_KEY: paved-deployer-sentinel-7c41e9
        run: |
          bun run --filter @paved/app build
          if [ -z "$(find packages/app/dist -name '*.map' -print -quit)" ]; then echo "No source map in dist/: the check would miss them"; exit 1; fi
          if grep -rlF "$VITE_DEPLOYER_PRIVATE_KEY" packages/app/dist; then echo "The deployer key is in the Sepolia build"; exit 1; fi
        shell: bash
      - name: Prune turbo's cache to this run
        if: ${{ !cancelled() }}
        run: node scripts/ci/turbo-cache-prune.mts .turbo/cache .turbo/runs
      # actions/cache/save v4.2.4
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-client-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

  # The app's unit tests (vitest), in three shards of its test files: vitest's `--shard i/n` puts every file in exactly one
  # shard, so the shards' "Tests" lines add up to the suite. Three, not two: the suite took 550 s on its own on main
  # (2026-11-09), so two shards would sit near 4.5 min with the setup. The app is built first (through turbo's cache):
  # its dist/ is what board-modules and first-load-modules test, and they skip without it.
  client-app:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    name: Test client app (shard ${{ matrix.shard }}/3)
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      TURBO_CACHE_DIR: .turbo/cache
      TURBO_RUN_SUMMARY: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/client-setup
      # One cache for the three shards: they build the same tasks, and the first to finish saves it (the others' save
      # finds the key taken; a save never fails the job).
      # actions/cache/restore v4.2.4
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-client-app-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-client-app-${{ github.head_ref || github.ref_name }}-
            turbo-${{ runner.os }}-client-app-main-
      - name: Build the app and its workspace packages
        run: bun run build --filter=@paved/app
      - name: Test (shard ${{ matrix.shard }}/3)
        working-directory: packages/app
        run: bun run test --shard=${{ matrix.shard }}/3
      - name: Prune turbo's cache to this run
        if: ${{ !cancelled() }}
        run: node scripts/ci/turbo-cache-prune.mts .turbo/cache .turbo/runs
      # actions/cache/save v4.2.4
      - if: ${{ !cancelled() }}
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        continue-on-error: true
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-client-app-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

  client-storybook:
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-latest
    name: Client header sweep and mobile feel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/client-setup
        with:
          browser: "true"
      # The packages the app imports resolve to their dist/: game-core, chain, renderer and ui, not the app itself.
      - name: Build the app's workspace packages
        run: bun run build --filter='@paved/app^...'
      # A broken story fails the pull request (docs/client/v2-architecture.md, section 4.4).
      - name: Build Storybook
        run: bun run --filter @paved/app build-storybook
      # HEADER-HEIGHT (#676): every page's header as tall as `--header-h`, one height per width, at 375 and 1440 px
      # (packages/app/scripts/header-sweep.ts, the `Pages/Headers` stories).
      - name: Header sweep (375 and 1440 px)
        run: bun run --filter @paved/app header-sweep
      # APP-FEEL (P-69): a mobile device context, headless: no page zoom, the board still pinch-zooms.
      - name: Mobile feel (Pixel 7 profile)
        run: bun run --filter @paved/app mobile-feel
      # NUM-LOCALE (P-66): the figures read en-US in a de-DE browser. The second half of the app's `wrap-sweep` script, run
      # here once rather than in each wrap shard.
      - name: Locale check (de-DE)
        working-directory: packages/app
        run: node scripts/locale-check.ts

  # WRAP360: the stories at 360 and 320 px, headless; fails on text that overflows, is cut without its full value, or
  # scrolls the page (packages/app/scripts/wrap-sweep.ts). In shards (`--shard i/n`, SWEEP-SHARD-1): every story of the
  # list is in exactly one, the shards balanced by each story's time (packages/app/scripts/wrap-sweep-times.json, SWEEP-SPEED).
  # One failing shard does not cancel the others. The list is every story on the merge queue and main (five shards); on a
  # pull request, the stories its change reaches (the `stories` step of `changes`), and no job when it reaches none.
  wrap-sweep:
    needs: changes
    if: needs.changes.outputs.client == 'true' && needs.changes.outputs.stories != 'none'
    runs-on: ubuntu-latest
    name: Wrap sweep (shard ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/client-setup
        with:
          browser: "true"
      - name: Build the app's workspace packages
        run: bun run build --filter='@paved/app^...'
      - name: Build Storybook
        run: bun run --filter @paved/app build-storybook
      # The story ids of the selected files, through the built index.json (one a line; none when they hold docs only).
      - name: Selected stories
        if: needs.changes.outputs.stories == 'some'
        working-directory: packages/app
        env:
          STORY_FILES: ${{ needs.changes.outputs.story_files }}
        run: |
          printenv STORY_FILES > "$RUNNER_TEMP/story-files.json"
          node ../../scripts/check/stories.mts ids storybook-static/index.json "$RUNNER_TEMP/story-files.json" > "$RUNNER_TEMP/stories.txt"
          echo "$(grep -c . "$RUNNER_TEMP/stories.txt" || true) stories selected"
        shell: bash
      - name: Wrap sweep (360 and 320 px)
        working-directory: packages/app
        env:
          MODE: ${{ needs.changes.outputs.stories }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.shard_count }}
        run: |
          if [ "$MODE" = some ]; then node scripts/wrap-sweep.ts --stories "$RUNNER_TEMP/stories.txt" --shard "$SHARD" --json "$RUNNER_TEMP/wrap-sweep.json"
          else node scripts/wrap-sweep.ts --shard "$SHARD" --json "$RUNNER_TEMP/wrap-sweep.json"; fi
        shell: bash
      # Each story's time (SWEEP-SPEED): `node scripts/wrap-sweep-times.ts --run <run id>` refreshes the times file the shards
      # are balanced on from the reports of a full sweep (a merge-queue or main run).
      # actions/upload-artifact v4.6.2
      - name: Upload the sweep's report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrap-sweep-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/wrap-sweep.json
          retention-days: 30
          if-no-files-found: ignore

  # The Training battle test (P-79, packages/app/e2e): complete games played by a bot in headless Chromium on the plan
  # view, against the Vite dev server with no chain, every move checked against the engine's replay of the save. It runs
  # beside the client job, not after it (PVD-228): it installs, builds and fetches its browser on its own, so waiting
  # for the client job only added that job's time to the critical path. A client that does not build fails in both jobs;
  # the `ci` job requires both. Every path of the e2e filter is in the client filter, so the client job runs whenever
  # this one would.
  e2e:
    needs: changes
    # The merge queue and main: the whole `e2e` filter. A pull request: its own `e2e_pr` filter (CI-TIERS).
    if: needs.changes.outputs.e2e == 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.e2e_pr == 'true')
    runs-on: ubuntu-latest
    name: Training e2e (headless)
    # About 1 min of tests locally for the default 2 games; the setup and the build come on top. On CI the whole job
    # took 733 to 899 s in its successful runs of 2026-11-08 (Stolsis CI, last 40 runs), so 15 min cut runs whose
    # tests all passed; the ceiling is 1.5x the longest, rounded up to a whole minute.
    timeout-minutes: 23
    permissions:
      contents: read
    env:
      # 1.5x the run's measured peak (709 MB, the largest process of the tree), rounded up to 64 MB.
      NODE_OPTIONS: --max-old-space-size=1088
      PAVED_E2E_GAMES: "2"
      PAVED_E2E_ARTIFACTS: ${{ github.workspace }}/e2e-artifacts
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      # The same modules cache and key as the client job: the same files, so one job's save serves the other.
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        id: modules
        with:
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
            !packages/*/node_modules/.cache
            !packages/*/node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-node-24-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json') }}
      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile
      # The packages the app imports resolve to their dist/, which does not reach this runner from the client job's: game-core,
      # chain and renderer are built again here, as the client job builds them.
      - name: Build the app's workspace packages
        run: bun run build --filter='@paved/app^...'
      # The browser of the wrap sweep: the one the app's playwright-core names, under the same cache key.
      - name: Playwright version
        id: playwright
        working-directory: packages/app
        run: echo "version=$(bun -e 'console.log(require("playwright-core/package.json").version)')" >> "$GITHUB_OUTPUT"
        shell: bash
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      - name: Install the browser
        working-directory: packages/app
        run: bunx playwright-core install --with-deps chromium-headless-shell
        shell: bash
      # Every seed is in the log and in the artifact: a failing game replays locally with PAVED_E2E_SEED (e2e/training.e2e.ts).
      - name: Training e2e
        run: bun run --filter @paved/app e2e
      # The seeds and the page's last screenshot of a failed test.
      # actions/upload-artifact v4.6.2
      - name: Upload the seeds and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-artifacts
          path: e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore

  signer:
    needs: changes
    if: needs.changes.outputs.signer == 'true'
    runs-on: ubuntu-latest
    name: Test signer
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # In scripts/signer/ only, from its lockfile. The devnet rehearsal tests skip themselves: no node binary and no
      # build here (they run on the VPS, docs/programme/OPERATIONS.md).
      - name: Test
        working-directory: scripts/signer
        run: npm ci --ignore-scripts --no-audit --no-fund && npm test
        shell: bash

  # GUARDS (P-71): the exact Vercel build of each project (its vercel.json's install and build commands, from its root
  # directory, with the Sepolia env of packages/app/vercel.json), so a Vercel break shows on the pull request before the
  # merge, not on main. `bun run check` runs the same script locally. Keep the job's name: it may become a required check.
  vercel:
    needs: changes
    if: needs.changes.outputs.vercel == 'true'
    runs-on: ubuntu-latest
    name: Vercel build (Sepolia)
    permissions:
      contents: read
    steps:
      # The whole history: the ignore step's test judges real commits of main.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # The same setup and cache as the client job.
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
      # actions/cache v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: |
            node_modules
            packages/*/node_modules
            !node_modules/.cache
            !packages/*/node_modules/.cache
            !packages/*/node_modules/.vite
          key: node-modules-${{ runner.os }}-${{ steps.image.outputs.os }}-${{ runner.arch }}-node-24-bun-1.4.2-${{ hashFiles('bun.lock', 'package.json', 'packages/*/package.json') }}
      # The guards' own tests: the touched set of `bun run check` and the Vercel ignore step on real commits.
      - name: Guard scripts
        run: |
          node --test scripts/check/touched.test.mts scripts/check/stories.test.mts scripts/check/turbo-inputs.test.mts
          node --test scripts/ci/nightly-flaky.test.mts scripts/ci/turbo-cache-prune.test.mts
          sh scripts/vercel/ignore-build.test.sh
        shell: bash
      # Each command runs its vercel.json's installCommand first (bun install --frozen-lockfile), as Vercel does.
      - name: Client (packages/app/vercel.json)
        run: node scripts/check/vercel-build.mts client
      - name: Bundle budget, with its margins
        run: bun run budget
      - name: Storybook (vercel.json)
        run: node scripts/check/vercel-build.mts storybook --no-install

  ci:
    runs-on: ubuntu-latest
    name: ci
    if: always()
    needs: [changes, check, build, abis, test, indexer, client, client-app, client-storybook, wrap-sweep, e2e, signer, vercel]
    steps:
      - name: Require every job to have succeeded or been skipped
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then exit 1; fi
        shell: bash
