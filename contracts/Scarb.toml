[package]
name = "paved"
version = "0.0.0"
edition = "2023_11"

[cairo]
sierra-replace-ids = true

[scripts]
test = "snforge test"

[dependencies]
starknet = "2.20.1"
quiver_quest = "=0.2.0"
quiver_achievement = "=0.2.0"
openzeppelin_interfaces = "=2.2.0"
openzeppelin_token = "=4.0.1"
openzeppelin_upgrades = "=4.0.1"

[[target.starknet-contract]]
casm = true

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
inlining-strategy = "avoid"

[dev-dependencies]
cairo_test = "2.20.1"
snforge_std = "=0.64.0"
snforge_scarb_plugin = "=0.64.0"

# Line coverage (`snforge test --coverage`, scripts/measure.sh coverage*) needs the code locations;
# they cost about 2.5 GB of peak memory in the test build, so only this profile has them.
[profile.coverage]
inherits = "dev"

[profile.coverage.cairo]
unstable-add-statements-code-locations-debug-info = true

# The mainnet fork of the E-9 tests (`src/tests/economy/fork.cairo`, opt-in: `snforge test
# paved::tests::economy::fork --ignored`). A public RPC that needs no key; the block is pinned.
[[tool.snforge.fork]]
name = "MAINNET"
url = "https://api.cartridge.gg/x/starknet/mainnet/rpc/v0_10"
block_id.number = "16265000"
